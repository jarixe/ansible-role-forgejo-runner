---
- name: Assert runner connection credentials are set
  ansible.builtin.assert:
    that:
      - forgejo_runner_uuid | length > 0
      - forgejo_runner_token | length > 0
    fail_msg: >-
      Set forgejo_runner_uuid and forgejo_runner_token (Site Admin -> Actions
      -> Runners -> Create new runner in Forgejo, shown only once).

- name: Ensure the forgejo-runner group exists
  ansible.builtin.group:
    name: "{{ forgejo_runner_group }}"
    system: true

- name: Ensure the forgejo-runner user exists
  ansible.builtin.user:
    name: "{{ forgejo_runner_user }}"
    group: "{{ forgejo_runner_group }}"
    groups: docker
    append: true
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Ensure the install and data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ forgejo_runner_user }}"
    group: "{{ forgejo_runner_group }}"
    mode: "0750"
  loop:
    - "{{ forgejo_runner_install_dir }}"
    - "{{ forgejo_runner_install_dir }}/cache"
    - "{{ forgejo_runner_install_dir }}/workspace"

- name: Download the forgejo-runner binary
  ansible.builtin.get_url:
    url: "{{ forgejo_runner_url }}"
    dest: "/usr/src/forgejo-runner-{{ forgejo_runner_version }}-linux-amd64"
    mode: "0755"

- name: Install the forgejo-runner binary
  ansible.builtin.copy:
    src: "/usr/src/forgejo-runner-{{ forgejo_runner_version }}-linux-amd64"
    dest: "{{ forgejo_runner_install_dir }}/forgejo-runner"
    mode: "0755"
    remote_src: true
  notify: Restart forgejo-runner

- name: Deploy the forgejo-runner configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ forgejo_runner_install_dir }}/config.yaml"
    owner: "{{ forgejo_runner_user }}"
    group: "{{ forgejo_runner_group }}"
    mode: "0600"
  notify: Restart forgejo-runner

- name: Deploy the forgejo-runner systemd unit
  ansible.builtin.template:
    src: forgejo-runner.service.j2
    dest: /etc/systemd/system/forgejo-runner.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart forgejo-runner

- name: Ensure the forgejo-runner service is started and enabled
  ansible.builtin.systemd:
    name: forgejo-runner
    state: started
    enabled: true
